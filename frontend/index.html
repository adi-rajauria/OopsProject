<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Decerno: Intelligent IT Service Management and Incident Resolution System" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%233b33a6'/><path d='M9.5 8h6.5a8 8 0 0 1 0 16H9.5Z' stroke='white' stroke-width='2.6' fill='none' stroke-linejoin='round'/><path d='M12.8 16.3l2.6 2.6 4.6-5' stroke='%23e3ad2b' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
    <title>Decerno</title>
    <!-- Apply a saved theme choice before first paint (no light/dark flash). -->
    <script>
      try {
        var t = localStorage.getItem("itsm-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
