<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Decerno: Intelligent IT Service Management and Incident Resolution System" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230f5f5c'/><path d='M16 7.5a8.5 8.5 0 1 1-8.5 8.5' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/><circle cx='16' cy='16' r='2.6' fill='white'/></svg>" />
    <title>Decerno</title>
    <!-- Apply a saved theme choice before first paint (no light/dark flash). -->
    <script>
      try {
        var t = localStorage.getItem("itsm-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
