name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: itsm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Migrate and seed a fresh PostgreSQL database (same steps as the local setup)
        if: matrix.database == 'postgresql'
        env:
          ITSM_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/itsm
          ITSM_JWT_SECRET: ci-only-secret-that-is-long-enough-for-hs256
          ITSM_SLA_MONITOR_ENABLED: "false"
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE itsm"
          alembic -x url="$ITSM_DATABASE_URL" upgrade head
          python -m scripts.seed

      - name: Run pytest on SQLite (in memory)
        if: matrix.database == 'sqlite'
        run: pytest -q

      - name: Run pytest on PostgreSQL 18
        if: matrix.database == 'postgresql'
        env:
          ITSM_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/itsm_test
        run: pytest -q

  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build
